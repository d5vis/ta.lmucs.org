# Weekly grouped minors/patches keep noise down; majors arrive as separate
# individual PRs. TypeScript majors are adopted deliberately, so they are
# ignored. There is no github-actions block: this repo has no workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
