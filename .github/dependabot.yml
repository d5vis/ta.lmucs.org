# Weekly grouped minors/patches keep noise down; majors arrive as separate
# individual PRs. Explicit ignores hold intentional pins (@types/node tracks
# the runtime major in .nvmrc; TypeScript majors are adopted deliberately).
# There is no github-actions block: this repo has no workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
